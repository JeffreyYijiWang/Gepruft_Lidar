[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lms200"
version = "0.1.0"
description = "Documented LMS200 serial acquisition, replay, and local dashboard"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "pyserial>=3.5,<4", "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.9,<1", "mypy>=1.13,<2", "types-pyserial>=3.5"]

[project.scripts]
lms200 = "lms200.cli:main"
lms200-bridge = "lms200.bridge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lms200 = ["web/*", "py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["hardware: opt-in tests requiring a physical LMS200", "posix: requires POSIX pseudo-terminals"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC110"]  # Bounded polling of externally observable integration state.

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
